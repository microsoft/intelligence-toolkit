[project]
name = "itk-anonymize"
version = "0.1.0"
description = "Differentially private case data anonymization for Intelligence Toolkit: prepare, synthesize, aggregate, evaluate and query"
authors = [
    {name = "Dayenne Souza", email = "ddesouza@microsoft.com"},
    {name = "Ha Trinh", email = "trinhha@microsoft.com"},
    {name = "Darren Edge", email = "daedge@microsoft.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=0.20.10",
    "pydantic>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itk_anonymize"]
