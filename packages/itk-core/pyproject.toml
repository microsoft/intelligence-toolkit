[project]
name = "itk-core"
version = "0.1.0"
description = "Shared AI core for Intelligence Toolkit: LLM client, embedders and vector store"
authors = [
    {name = "Dayenne Souza", email = "ddesouza@microsoft.com"},
    {name = "Ha Trinh", email = "trinhha@microsoft.com"},
    {name = "Darren Edge", email = "daedge@microsoft.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.37.1,<2.0.0",
    "azure-identity>=1.17.1",
    "tiktoken>=0.7.0",
    "numpy>=1.26.4",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "lancedb>=0.14.0",
    "duckdb>=1.1.0",
    "pylance>=0.18.2",
    # semchunk 3+ changes chunk boundaries
    "semchunk>=2.2.0,<3",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# LocalEmbedder (sentence-transformers pulls in torch).
local = ["sentence-transformers>=3.1.1,<4.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itk_core"]
