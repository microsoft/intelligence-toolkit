[project]
name = "itk-schemify"
version = "0.1.0"
description = "Schemify for Intelligence Toolkit: web-grounded entity extraction, schema discovery, duplicate resolution, audits and review dashboards"
authors = [
    {name = "Dayenne Souza", email = "ddesouza@microsoft.com"},
    {name = "Ha Trinh", email = "trinhha@microsoft.com"},
    {name = "Darren Edge", email = "daedge@microsoft.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipython>=8.0",
    "jsonschema>=4.0.0",
    "openai>=1.37.1,<2.0.0",
    "pandas>=2.0.0",
    "pypdf>=5.1.0,<6.0.0",
    "rapidfuzz>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itk_schemify"]
