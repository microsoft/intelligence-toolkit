[project]
name = "itk-entities"
version = "0.1.0"
description = "Build Entity Dataset for Intelligence Toolkit: web-grounded research runs, curation, audits, recategorization and release packaging on top of itk-schemify"
authors = [
    {name = "Dayenne Souza", email = "ddesouza@microsoft.com"},
    {name = "Ha Trinh", email = "trinhha@microsoft.com"},
    {name = "Darren Edge", email = "daedge@microsoft.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "itk-core",
    "itk-schemify",
    "openai>=1.37.1,<2.0.0",
    "pandas>=2.0.0",
]

[tool.uv.sources]
itk-core = { workspace = true }
itk-schemify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itk_entities"]
