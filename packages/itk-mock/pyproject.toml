[project]
name = "itk-mock"
version = "0.1.0"
description = "Mock data generation for Intelligence Toolkit: JSON schema building, schema-guided LLM record generation and per-record text generation"
authors = [
    {name = "Dayenne Souza", email = "ddesouza@microsoft.com"},
    {name = "Ha Trinh", email = "trinhha@microsoft.com"},
    {name = "Darren Edge", email = "daedge@microsoft.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "itk-core",
    "jsonschema>=4.0.0",
    "polars>=0.20.10",
    "pydantic>=2.0,<3.0",
]

[tool.uv.sources]
itk-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itk_mock"]
