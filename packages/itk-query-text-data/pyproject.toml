[project]
name = "itk-query-text-data"
version = "0.1.0"
description = "Query Text Data workflow (v2) for Intelligence Toolkit: concept graphs, relevance search and grounded answers over text corpora"
authors = [
    {name = "Dayenne Souza", email = "ddesouza@microsoft.com"},
    {name = "Ha Trinh", email = "trinhha@microsoft.com"},
    {name = "Darren Edge", email = "daedge@microsoft.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "itk-core",
    # 1.3 changes Leiden partitions; the test goldens are pinned to 1.2.x.
    "graspologic-native>=1.2.1,<1.3",
    "networkx>=3.0",
    "nltk>=3.8",
    "numpy>=1.26.4",
    "pandas>=2.0.0",
    "pypdf>=5.1.0,<6.0.0",
    "textblob>=0.18.0",
    "tiktoken>=0.7.0",
]

[tool.uv.sources]
itk-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itk_query_text_data"]
