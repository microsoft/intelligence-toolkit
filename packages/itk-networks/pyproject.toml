[project]
name = "itk-networks"
version = "0.1.0"
description = "Entity network detection for Intelligence Toolkit: attribute graphs, inferred links, bounded communities and flag exposure reports"
authors = [
    {name = "Dayenne Souza", email = "ddesouza@microsoft.com"},
    {name = "Ha Trinh", email = "trinhha@microsoft.com"},
    {name = "Darren Edge", email = "daedge@microsoft.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "itk-core",
    "networkx>=3.0",
    "numpy>=1.26.4",
    "polars>=0.20.10",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
leiden = ["graspologic>=3.4.1,<4.0.0"]
sklearn = ["scikit-learn>=1.5.0"]

[tool.uv.sources]
itk-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itk_networks"]
